# Tunable parameters for src/nobody_flux/vad.py's VoiceActivityDetector
# (TEN-VAD via sherpa_onnx). Same "swap via config, not code" idea as
# models.yaml -- change a value here, no code edit, no CLI flag to remember.
# See VoiceActivityDetector's own docstring/field comments for what each one
# does and why its default is what it is.

# 0.5 (TenVadModelConfig's own stock default) missed real speech entirely on
# this dev box's mic (WSL2/WSLg PulseAudio passthrough) -- confirmed by hand
# with scripts/_debug_vad_mic.py: a captured utterance with normal speech-level
# RMS (0.04-0.10, not clipped) never crossed 0.5 confidence, while sweeping
# threshold down showed detection kicks in reliably at 0.3 and stays reliable
# below that. Lowered with a small safety margin under the confirmed working
# point, not down at the floor (0.05) where background noise false-positives
# become more likely -- if this mic/room still under- or over-triggers,
# re-run that debug script rather than guessing at a new number.
threshold: 0.25
min_silence_duration: 0.5
min_speech_duration: 0.15
max_speech_duration: 20.0
pre_roll_ms: 300
num_threads: 1

# docs/barge-in-design.md's stage 1 (delayed-stop): how long speech has to
# continue before talk.py treats it as a real interruption instead of
# backchannel ("어", "응"). 250ms, recalibrated from an initial 400ms guess
# against LiveKit's Adaptive Interruption Handling (216ms median duration to
# decide, in production) -- see the design doc's "관련 연구" section. Not yet
# validated against this project's own mic/room the way threshold above was
# (scripts/_debug_vad_mic.py) -- re-run that kind of check if barge-in feels
# too trigger-happy or too sluggish in practice.
barge_in_confirm_ms: 250

# Phase 2 adaptive endpoint grace -- only in effect with talk.py --endpoint-detect
# (Smart Turn v3). After an "incomplete turn" verdict, how long to wait in
# continued silence for the user to resume before giving up is scaled by the
# detector's P(complete): a clear mid-thought pause waits up to endpoint_grace_ms,
# a borderline one down toward endpoint_grace_min_ms. Set adaptive_endpoint_grace
# false to pin it at the fixed endpoint_grace_ms (pre-Phase-2 behavior). Not yet
# mic-validated -- confirm the range on a real mic like the other VAD thresholds.
endpoint_grace_ms: 800
endpoint_grace_min_ms: 300
adaptive_endpoint_grace: true
