# Tunable parameters for src/nobody_flux/vad.py's VoiceActivityDetector
# (TEN-VAD via sherpa_onnx). Same "swap via config, not code" idea as
# models.yaml -- change a value here, no code edit, no CLI flag to remember.
# See VoiceActivityDetector's own docstring/field comments for what each one
# does and why its default is what it is.

# Measured on the native-Windows box's USB microphone with
# scripts/_calibrate_vad_threshold.py (real room tone as the negative case, a
# known utterance mixed onto it as the positive one):
#
#   thresh   room frames flagged speech   segment closes after speech ends
#     0.25              97.3%             never (max_speech_duration forces it)
#     0.30              27.2%             -- (fragments the utterance)
#     0.40               0.0%             1.68s
#     0.50               0.0%             0.81s
#
# This replaces an earlier 0.25, which had been lowered because TEN-VAD missed
# speech on the old WSL2/WSLg passthrough mic. On real hardware that value is
# actively broken: at 0.25 the model reports speech through *silence*, so the
# segment never finalizes and the turn never ends -- the user speaks and gets
# no reply at all. Detection was never the real problem; at 0.5 this mic
# detects the reference utterance down to peak 0.04 (SNR 2.9 dB, i.e. clearly
# quiet speech) with onset landing within 0.04s of the true one.
#
# Device dependent, so re-run the calibration script rather than copying this
# number to a different microphone -- both failure directions are real.
threshold: 0.5
min_silence_duration: 0.5
min_speech_duration: 0.15
max_speech_duration: 20.0
# How much audio before the VAD's detected onset is prepended to the captured
# utterance, to recover the head of the word the VAD needed a few frames to be
# sure about.
#
# Raised from 300 after a live session lost one: the turn "산책 코스 추천해줘"
# came back as "코 추천해 줘", and measuring the saved capture showed speech
# beginning at 0ms -- there was no lead-in left at all. A soft onset (the ㅅ
# fricative here) gives TEN-VAD little to trigger on, so detection lands well
# after the true start even when the speaker is at a normal level.
#
# 500 rather than more because the cost is real but small (every capture carries
# 200ms more audio into ASR) and the benefit saturates: replayed at 0.25/0.15/
# 0.08 peak through the same VadStream, 300/500/800 all transcribe identically,
# so this is insurance against soft onsets rather than a general accuracy gain.
pre_roll_ms: 500
num_threads: 1

# docs/barge-in-design.md's stage 1 (delayed-stop): how long speech has to
# continue before talk.py treats it as a real interruption instead of
# backchannel ("어", "응"). 250ms, recalibrated from an initial 400ms guess
# against LiveKit's Adaptive Interruption Handling (216ms median duration to
# decide, in production) -- see the design doc's "관련 연구" section. Not yet
# validated against this project's own mic/room the way threshold above was
# (scripts/_debug_vad_mic.py) -- re-run that kind of check if barge-in feels
# too trigger-happy or too sluggish in practice.
barge_in_confirm_ms: 250

# Phase 2 adaptive endpoint grace -- only in effect with talk.py --endpoint-detect
# (Smart Turn v3). After an "incomplete turn" verdict, how long to wait in
# continued silence for the user to resume before giving up is scaled by the
# detector's P(complete): a clear mid-thought pause waits up to endpoint_grace_ms,
# a borderline one down toward endpoint_grace_min_ms. Set adaptive_endpoint_grace
# false to pin it at the fixed endpoint_grace_ms (pre-Phase-2 behavior). Not yet
# mic-validated -- confirm the range on a real mic like the other VAD thresholds.
endpoint_grace_ms: 800
endpoint_grace_min_ms: 300
adaptive_endpoint_grace: true
