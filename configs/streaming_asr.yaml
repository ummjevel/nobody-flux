# Tunable parameters for src/nobody_flux/stage/asr_stream.py's
# StreamingTranscriber -- the Phase 3 live recognizer that decodes while the
# user is still speaking, instead of transcribing a recorded wav afterwards.
#
# Same "change a value here, no code edit" pattern as vad.yaml and
# turn_detector.yaml. Used only by scripts/talk.py's --streaming-asr; the batch
# ASR presets in models.yaml are unaffected.
#
# See the StreamingTranscriber docstring for what each field does and why its
# default is what it is.

model_dir: models/streaming-zipformer-ko
use_int8: true
num_threads: 2

# --- LocalAgreement stabilization -------------------------------------------
# How many consecutive decoder hypotheses must agree before their common prefix
# is treated as committed (i.e. safe to act on, guaranteed never to be
# retracted). 2 matches whisper-streaming's default: it eliminates the great
# majority of retractions at the cost of one decoder update's delay. Raising it
# trades commit latency for stability, roughly one frame period per increment.
agreement_n: 2

# --- Endpoint detection -----------------------------------------------------
# The recognizer's own endpointing, which decides an utterance is over from
# decoder state rather than from raw acoustic energy the way TEN-VAD does. Both
# signals run; turn/controller.py arbitrates. Keeping this enabled costs
# nothing and gives the controller a second opinion that fails differently.
enable_endpoint_detection: true

# Trailing silence to end a turn when nothing has been decoded yet -- the
# "stream opened but the user never really spoke" timeout. sherpa-onnx's own
# default; kept generous because firing early here cuts off someone who merely
# paused before starting.
rule1_min_trailing_silence: 2.4

# Trailing silence after something HAS been decoded. This is the one that
# governs conversational responsiveness, and sherpa-onnx's 1.2s default is much
# too slow -- a listener reads a 1.2s gap as the other person having finished.
# 0.6s sits just above vad.yaml's min_silence_duration (0.5s), so TEN-VAD (the
# tighter, already mic-tuned signal) normally ends the turn first and this acts
# as a backstop rather than the primary. ESTIMATED, not yet measured on a real
# microphone -- confirm it the same way vad.yaml's threshold was, with
# scripts/_debug_vad_mic.py and _calibrate_turn_params.py.
rule2_min_trailing_silence: 0.6

# Hard cap on one utterance. Mirrors vad.yaml's max_speech_duration so neither
# component can hold a turn open on its own.
rule3_min_utterance_length: 20.0
