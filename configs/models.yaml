# Named presets for each pipeline stage, selectable via --asr/--llm/--tts on
# scripts/run_pipeline.py and scripts/talk.py without touching code.
#
# Adding a new candidate model (e.g. from docs/output/ondevice_asr_llm_tts_research_20260716.md):
#   1. Implement it as a class in src/nobody_flux/{asr,llm,tts}.py with the same
#      call signature as the existing NobodyASR/NobodyLLM/NobodyTTS (transcribe_file
#      / reply / synthesize).
#   2. Add a preset entry below pointing `class` at it and `params` at its
#      constructor kwargs. Paths in params are resolved relative to the project root.
#   3. Run with --asr/--llm/--tts <preset-name> to compare against the default.
#
defaults:
  asr: sense-voice-small
  # Changed from qwen3-0.6b-gguf 2026-08 after measuring persona adherence and
  # conversational behaviour together (scripts/_ab_persona.py). The 0.6B broke a
  # rule in 5 of 18 replies and handed the turn back only a third of the time;
  # Mi:dm broke none, was never repetitive, and is FASTER per turn than the
  # 1.7B alternative. See docs/llm-conversational-selection.md.
  llm: midm-2.3b-gguf
  tts: sherpa-matcha-ko

asr:
  sense-voice-small:
    class: NobodyASR
    params:
      model_dir: models/sense-voice
      use_int8: true
      language: ko

  # Second candidate, added for comparison -- see src/nobody_flux/asr.py's
  # VibeAsrBitnet docstring (microsoft/VibeVoice-ASR-BitNet via VibeASR.cpp,
  # CPU-only, ARM-relevant for the CM4 target). Needs a compiled asr_infer
  # binary + downloaded GGUF weights, see scripts/setup_common.sh step 5.
  vibeasr-bitnet:
    class: VibeAsrBitnet
    params:
      repo_dir: external/VibeASR.cpp
      vae_model: models/vibeasr/vibeasr-vae-encoder-i8_s.gguf
      lm_model: models/vibeasr/vibeasr-lm-i2_s-embed-q6_k.gguf

  # Third candidate: k2-fsa streaming Zipformer transducer for Korean
  # (Apache-2.0, native Korean, streaming-capable, int8 CM4-friendly) -- see
  # src/nobody_flux/asr.py's StreamingZipformerAsr docstring. Used here in a
  # drop-in batch-decode way for a like-for-like comparison against
  # sense-voice-small; the real streaming integration (live partials +
  # recognizer endpointing) is a later, larger change. Needs
  # models/streaming-zipformer-ko/ (scripts/setup_common.sh step 11).
  streaming-zipformer-ko:
    class: StreamingZipformerAsr
    params: {}  # every field already defaults to the right paths (int8)

llm:
  qwen3-0.6b:
    class: NobodyLLM
    params:
      model_id: Qwen/Qwen3-0.6B

  # Second candidate: same Qwen3-0.6B weights, GGUF Q4_K_M quantization run
  # through llama-cpp-python instead of raw transformers -- see
  # src/nobody_flux/llm.py's NobodyLLMGguf docstring. Confirmed by hand
  # ~2-2.5x faster per turn on CPU than qwen3-0.6b above (same model, same
  # license, only the runtime differs). Needs models/qwen3-0.6b-gguf/ (see
  # scripts/setup_common.sh) and llama-cpp-python (pyproject.toml).
  qwen3-0.6b-gguf:
    class: NobodyLLMGguf
    params: {}  # every field already defaults to the right paths/model

  # --- Larger on-device candidates (2026-08 LLM 고도화) --------------------
  # All Q4_K_M GGUF on llama.cpp, i.e. the same CPU path the CM4 target uses.
  # The shortlist stops around 2B parameters for that reason: a model that only
  # behaves well on this desktop is not a candidate for a board with no GPU.
  #
  # Compare them with scripts/_ab_persona.py, which scores persona adherence
  # (반말/이모지/앵무새/숫자) and turn latency together -- either one alone
  # picks the wrong model.

  # Same family as the default, one size up. Lowest-risk swap: identical chat
  # template, identical stop token, same thinking-mode switch.
  qwen3-1.7b-gguf:
    class: NobodyLLMGguf
    params:
      model_path: models/qwen3-1.7b-gguf/Qwen_Qwen3-1.7B-Q4_K_M.gguf
      tokenizer_id: Qwen/Qwen3-1.7B

  # Kakao Kanana Nano 2.1B, Korean-first pretraining rather than Korean as one
  # language among many. Llama-3 style template, so the turn boundary is
  # <|eot_id|>, not ChatML's.
  #
  # LICENSE: CC-BY-NC-4.0 -- NON-COMMERCIAL. (An earlier version of this comment
  # said Apache-2.0, which was wrong; the license was read from the model card
  # afterwards. Do not take a license from a quantizer's repo or from memory --
  # several of the Korean models here are custom or non-commercial, and the
  # quantized repos frequently omit or restate the terms incorrectly.)
  # Reference point for what a Korean-tuned model this size can do, not a
  # deployment candidate.
  kanana-2.1b-gguf:
    class: NobodyLLMGguf
    params:
      model_path: models/kanana-2.1b-gguf/kakaocorp.kanana-nano-2.1b-instruct.Q4_K_M.gguf
      tokenizer_id: kakaocorp/kanana-nano-2.1b-instruct
      stop: ["<|eot_id|>"]
      template_kwargs: {}

  # LG EXAONE 3.5 2.4B, also Korean-first, and the largest thing on the
  # shortlist. NOTE THE LICENSE: EXAONE AI Model License 1.1-NC is
  # non-commercial research only. Fine for evaluating what a Korean-tuned model
  # of this size can do; not something this project could ship. Kept as a
  # reference point rather than a deployment candidate.
  exaone-2.4b-gguf:
    class: NobodyLLMGguf
    params:
      model_path: models/exaone-2.4b-gguf/EXAONE-3.5-2.4B-Instruct-Q4_K_M.gguf
      tokenizer_id: LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
      stop: ["[|endofturn|]"]
      template_kwargs: {}

  # KT Mi:dm 2.0 Mini, 2.3B. The most interesting candidate on paper and the
  # only Korean-first one that is actually shippable:
  #   - MIT licensed, so commercial use is unrestricted (Kanana is NC, EXAONE
  #     is NC, HyperCLOVAX is custom+gated -- see below)
  #   - built FOR on-device use: pruned and distilled down from the Base model
  #     rather than being a small model that happens to exist
  #   - "Korea-centric" is their claim about socio-cultural grounding, not just
  #     Korean text throughput, which is closer to what a companion needs than
  #     a higher KMMLU score is
  #
  # Its chat template is Llama-3 style (<|eot_id|>), and it PREPENDS about a
  # thousand tokens of KT's own system prompt before ours -- including
  # instructions that contradict this project's persona directly:
  #   "너는 Mi:dm으로서..."                    (we want 퀜)
  #   "기본적으로 경어체를 사용해야 한다"        (we want 반말)
  #   "인공지능으로서 ... 의인화하지 않아야 한다" (we want a friend, not a tool)
  # persona.SYSTEM_PROMPT lands at the end of that block and wins in practice --
  # it scored 0/18 violations, better than anything else here. But that is a
  # last-instruction-wins effect, not agreement, so treat a sudden outbreak of
  # 존댓말 as this reasserting itself rather than as a regression in our prompt.
  midm-2.3b-gguf:
    class: NobodyLLMGguf
    params:
      model_path: models/midm-2.3b-gguf/Midm-2.0-Mini-Instruct-Q4_K_M.gguf
      tokenizer_id: K-intelligence/Midm-2.0-Mini-Instruct
      stop: ["<|eot_id|>"]
      template_kwargs: {}

  # Naver HyperCLOVAX-SEED 1.5B was the other Korean-first candidate and is NOT
  # here: the tokenizer repo is gated (HTTP 401), and this project renders
  # prompts with the model's own chat template via transformers, so a GGUF
  # without an accessible tokenizer cannot be driven. Its license is custom
  # ("hyperclovax-seed") rather than an SPDX one, so it would need reading
  # before use even with access.

  # Second candidate, added for comparison -- see docs/output/
  # ondevice_asr_llm_tts_research_20260716.md's LLM section update.
  # LiquidAI/LFM2-350M: hybrid conv+attention architecture designed
  # specifically for edge/on-device deployment, ~40% fewer params than
  # qwen3-0.6b (354M vs 600M), Korean among its 8 supported languages,
  # model card claims 2x faster CPU decode/prefill vs Qwen3. License is
  # LFM Open License v1.0 (Apache-style terms, but commercial use capped at
  # under 0M annual revenue -- not a fully open license like Apache-2.0,
  # worth noting even though it is a non-issue at this project's current
  # scale). device left at NobodyLLM's own default (cuda if available) --
  # override with --llm lfm2-350m and a device= override, or edit here, to
  # force CPU for CM4-realistic timing comparisons.
  lfm2-350m:
    class: NobodyLLM
    params:
      model_id: LiquidAI/LFM2-350M

  # Larger LFM2 variants (same family/license/architecture as lfm2-350m
  # above). The 2026-08 roadmap research flagged LFM2-700M/1.2B as the
  # strongest drop-in upgrade path over qwen3-0.6b for Korean quality on
  # CPU/ARM -- 350M is the fast floor, these two trade size for quality.
  # transformers>=4.54 has native LFM2 support (this project is on 4.57).
  # Like lfm2-350m, device is left at NobodyLLM's default (cuda if present) --
  # override to cpu for CM4-realistic timing. Weights download from HF on
  # first load (no setup_common.sh step needed -- transformers fetches them).
  #
  # Benchmark finding (2026-08, scripts/benchmark.py, 2 Korean test wavs on
  # this dev box's GPU): the research's "LFM2 is the strongest drop-in" did
  # NOT hold up for this specific short-casual-Korean persona. lfm2-350m
  # rambled in markdown bullet lists (terrible for TTS) and 존댓말; lfm2-700m
  # had the best casual 반말 tone (closest to the 퀜 persona) but was verbose,
  # emoji-happy, sometimes incoherent, and slower per turn (~2.7s vs
  # qwen3-0.6b-gguf's ~1.25s). None beat qwen3-0.6b-gguf on the
  # latency+persona-adherence balance. Kept as presets for future re-eval
  # (esp. if reply length/format gets constrained harder in persona.py or a
  # post-process step), but qwen3-0.6b-gguf stays the default.
  lfm2-700m:
    class: NobodyLLM
    params:
      model_id: LiquidAI/LFM2-700M

  lfm2-1.2b:
    class: NobodyLLM
    params:
      model_id: LiquidAI/LFM2-1.2B

tts:
  moss-tts-nano:
    class: NobodyTTS
    params:
      repo_dir: external/MOSS-TTS-Nano
      reference_audio: data/reference_voice_16k.wav
      # cpu, not auto/cuda: MOSS-TTS-Nano's isolated venv pins torch==2.7.0/cu126,
      # whose kernels predate RTX 5090/Blackwell (sm_120) -- confirmed by hand,
      # see src/nobody_flux/tts.py's NobodyTTS.device comment. On hardware where
      # that torch build's kernels actually match (e.g. H100/sm_90), add a
      # moss-tts-nano-cuda preset with device: cuda rather than editing this one.
      device: cpu

  # Second candidate, added for comparison -- see src/nobody_flux/tts.py's
  # FreyaTtsKo docstring. Its isolated venv resolved an untethered torch
  # version that DOES have sm_120 kernels, so device: cuda actually works
  # here (~7.4s vs moss-tts-nano's 50-96s CPU-only). Needs
  # external/freyatts-venv set up (see docstring) and models/freyatts-ko-voiceA/
  # (config.json + model.safetensors, copied from the voice-announce-mcp
  # sibling project -- the .safetensors is gitignored, same as ASR/other TTS
  # weights).
  freyatts-ko-voicea:
    class: FreyaTtsKo
    params:
      venv_dir: external/freyatts-venv
      model_dir: models/freyatts-ko-voiceA
      device: cuda
      steps: 32
      seed: 9

  # Third candidate, sherpa-onnx's own Matcha-TTS support -- see
  # src/nobody_flux/tts.py's SherpaMatchaTts docstring. k2-fsa itself only
  # ships English (en_US-ljspeech) and Chinese (zh-baker) checkpoints; this
  # is the English one, kept around for comparing sherpa-onnx's own TTS
  # runtime characteristics (not Korean -- see sherpa-matcha-ko below for
  # that). No isolated venv needed (in-process, same sherpa_onnx dependency
  # as sense-voice-small's ASR).
  sherpa-matcha-en:
    class: SherpaMatchaTts
    params: {}  # every field already defaults to the English checkpoint

  # DEFAULT. Same runtime as sherpa-matcha-en above, but with a
  # community/custom-trained Korean acoustic model (models/sherpa-matcha-ko/,
  # not from k2-fsa) swapped in -- see SherpaMatchaTts's docstring for why it
  # can reuse the English preset's vocoder/tokens/data_dir despite living in
  # a different directory. CPU-only (see the class's `provider` field);
  # picked as the project default for exactly that reason -- no isolated
  # venv, no GPU dependency, matches the eventual CM4 (no-GPU) target better
  # than freyatts-ko-voicea/moss-tts-nano.
  sherpa-matcha-ko:
    class: SherpaMatchaTts
    params:
      acoustic_model: models/sherpa-matcha-ko/matcha-ko-voiceA-ep499-steps10.onnx
      # Model-specific tokens.txt + vocoder now live alongside the acoustic
      # model itself (not reused from sherpa-matcha-en/ anymore) -- only
      # data_dir (espeak-ng-data) is still shared, since that's a
      # multi-language phoneme dictionary package, not something that needs
      # to be per-model.
      #
      # data_dir is required, not optional. espeak-ng is this model's actual
      # G2P (tokens.txt is the espeak IPA inventory, not Hangul), and pointing
      # data_dir anywhere invalid aborts the process at the C level -- rc=1,
      # no catchable exception. espeak-ng is GPL-3.0 and ships here with no
      # license text; sherpa-onnx 2.0.0 will remove it (#3731), which is why
      # the dependency is capped at <2. docs/output/research-delta-20260818.md §13
      vocoder: models/sherpa-matcha-ko/vocos-22khz-univ.onnx
      tokens: models/sherpa-matcha-ko/tokens.txt
      data_dir: models/sherpa-matcha-en/espeak-ng-data

  # Supertone's Supertonic 3, via the same in-process sherpa_onnx.OfflineTts
  # family -- no dependency bump needed, OfflineTtsSupertonicModelConfig is
  # already in the pinned sherpa-onnx 1.13.4. See SherpaSupertonicTts's
  # docstring in src/nobody_flux/stage/tts.py for the measurements.
  #
  # Notice what is NOT here: no tokens, no data_dir, no espeak-ng. Supertonic
  # is character-level (arXiv 2503.23108) and has no language conditioning at
  # all (tts.json: n_langs 0), so Hangul text needs no G2P and there is no
  # --lang to set. That is this preset's main structural advantage over
  # sherpa-matcha-ko, which reaches Korean only by borrowing the English
  # preset's espeak-ng-data.
  #
  # 44100Hz -- the highest-rate TTS here (Matcha is 22050), so the streaming
  # playback path resamples more per chunk.
  #
  # LICENSE, and this one matters. The LICENSE file shipped INSIDE the
  # sherpa-onnx model bundle says MIT, and that is WRONG for the weights --
  # it is Supertone's license for their sample *code*. The upstream README in
  # the same directory states: "The accompanying model is released under the
  # OpenRAIL-M License."
  #   verified at: https://huggingface.co/Supertone/supertonic-3/blob/main/LICENSE
  #                (BigScience OpenRAIL-M, 2022-08-18)
  # Commercial use IS permitted royalty-free, but the use-based restrictions
  # MUST be passed downstream as an enforceable provision, and three of them
  # bear on a voice companion directly: undisclosed machine-generated content
  # requires a clear disclaimer, impersonation/deepfakes without consent are
  # prohibited, and providing medical advice is prohibited.
  # This is a product/legal decision, not only a technical one -- which is why
  # this is a preset to compare against and not the default.
  # Supertonic **2** (2026-01, 5 languages incl. Korean). Same ONNX interface as
  # v3 -- verified: identical file set, same 44100Hz, no language conditioning --
  # so it reuses SherpaSupertonicTts with only the paths changed.
  #
  # Here because v3 traded a lot of speed for a little quality. sherpa-onnx's own
  # PR #3605 says the RTF went "from about 0.028 to about 0.097" going v2 -> v3
  # (v3 raised the flow-matching steps from 5 to 8), and the step count is NOT
  # exposed by OfflineTtsSupertonicModelConfig, so v2 is the only way to get the
  # cheaper setting through sherpa. Measured here: v2 is ~2.4x faster than v3 and
  # ~1.7x faster than the default matcha-ko.
  #
  # Upstream reports Korean CER 3.65 (v2) vs 3.26 (v3) -- a 12% relative
  # regression for that speed. Our own ASR round-trip cannot resolve a difference
  # that small (see scripts/_ab_tts.py on stochastic synthesis).
  #
  # Same OpenRAIL-M weights licence as v3, so adopting it is no new legal decision.
  supertonic-2-ko:
    class: SherpaSupertonicTts
    params:
      duration_predictor: models/sherpa-supertonic-2/duration_predictor.int8.onnx
      text_encoder: models/sherpa-supertonic-2/text_encoder.int8.onnx
      vector_estimator: models/sherpa-supertonic-2/vector_estimator.int8.onnx
      vocoder: models/sherpa-supertonic-2/vocoder.int8.onnx
      tts_json: models/sherpa-supertonic-2/tts.json
      unicode_indexer: models/sherpa-supertonic-2/unicode_indexer.bin
      voice_style: models/sherpa-supertonic-2/voice.bin
      speaker_id: 7

  supertonic-3-ko:
    class: SherpaSupertonicTts
    params:
      # sid=7, but NOT because it measured best. An earlier note here claimed a
      # 10-speaker ranking from single-sample CER; synthesis turned out to be
      # stochastic across processes, and that whole ranking (0.025-0.089) sat
      # inside the measurement's own noise band. Treat the choice as arbitrary
      # until someone listens to all ten.
      speaker_id: 7
